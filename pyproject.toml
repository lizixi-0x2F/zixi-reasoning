[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "zixi-reasoning"
version = "0.1.1"
description = "Reflective cognitive state machine: Markdown + WikiLink + state transitions + async crystallization."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
zixi = "zixi_reasoning.cli:main"
zixi-memoryd = "zixi_reasoning.daemon:main"

[project.entry-points."hermes_agent.memory_providers"]
zixi = "zixi_reasoning.provider:ZixiMemoryProvider"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["zixi_reasoning*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
